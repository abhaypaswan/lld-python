[tool.pytest.ini_options]
# Tests live next to the problem they cover, not in a central tests/ tree, so
# that a problem directory stays a self-contained thing you can read top to
# bottom. conftest.py at the repo root is what makes them importable.
testpaths = ["problems"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# This file is a dictionary of one-sentence prose explanations. Wrapping them
# with implicit string concatenation to satisfy the line limit makes them
# genuinely harder to read and to edit, for no benefit -- there is no code on
# those lines to follow.
"scripts/patterns_reference.py" = ["E501"]
